<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Bloop Grove — Ad 01</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #bfe6f2;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; inset: 0; pointer-events: none; overflow: hidden; color: #fff; z-index: 2;
        font-family: Bloop, 'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif; font-weight: 650;
      }
      #hud button { font-family: inherit; font-weight: 650; border: 0; cursor: pointer; pointer-events: auto; }

      #boot {
        position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 40%, #e9fbe3, #9fd88c 75%);
      }
      #boot i { width: 46px; height: 46px; border-radius: 50%; border: 6px solid rgba(255,255,255,.45); border-top-color: #fff; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* top bar */
      .top {
        position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px);
        transform: translate(-50%, -40px); opacity: 0; transition: .45s cubic-bezier(.3,1.5,.5,1);
        display: flex; align-items: center; gap: 10px;
      }
      .top.show { opacity: 1; transform: translate(-50%, 0); }
      .moves {
        width: min(21vw, 92px); height: min(21vw, 92px); border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff 0 8%, #b48cff 9% 30%, #7c4fe0 75%);
        border: 4px solid #fff; box-shadow: 0 5px 0 #5a35a8, 0 8px 16px rgba(60,30,90,.3);
        display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
      }
      .moves b { font-size: min(9.5vw, 40px); text-shadow: 0 3px 0 #4b2a8e; }
      .moves span { font-size: min(2.8vw, 12px); letter-spacing: 1px; opacity: .95; margin-top: 2px; }
      .moves.low { background: radial-gradient(circle at 35% 30%, #fff 0 8%, #ff9a8a 9% 30%, #e8504a 75%); box-shadow: 0 5px 0 #a8302c, 0 8px 16px rgba(90,30,30,.3); }
      .moves.tick { animation: tick .35s; }
      @keyframes tick { 40% { transform: scale(1.15); } }
      .goals {
        display: flex; gap: 8px; padding: 8px 12px; border-radius: 22px;
        background: rgba(255,255,255,.88); box-shadow: 0 4px 0 rgba(90,140,70,.45), 0 8px 18px rgba(40,80,40,.2);
      }
      .goal { position: relative; display: flex; align-items: center; gap: 4px; height: min(13vw, 56px); padding-right: 4px; }
      .goal img, .goal .hex { height: 100%; width: auto; }
      .goal .hex {
        aspect-ratio: 1; height: 78%; margin: 0 2px; border-radius: 30%;
        background: radial-gradient(circle at 35% 30%, #fff6c8 0 12%, #ffc23a 30%, #e88a00 90%);
        box-shadow: inset 0 -4px 0 rgba(160,80,0,.35), 0 2px 0 #c06a00;
      }
      .goal b { font-size: min(7.5vw, 32px); color: #5b3a8a; min-width: 1.1em; }
      .goal i {
        position: absolute; right: -4px; top: -2px; font-style: normal; font-size: 18px; width: 26px; height: 26px; border-radius: 50%;
        background: #4fca63; display: none; align-items: center; justify-content: center; border: 3px solid #fff;
      }
      .goal.done b { visibility: hidden; }
      .goal.done i { display: flex; }
      .goal.bump { animation: bump .45s; }
      @keyframes bump { 35% { transform: scale(1.25) rotate(-6deg); } }

      /* logo intro */
      .logo {
        position: absolute; left: 50%; top: 42%; width: min(70vw, 340px); transform: translate(-50%, -50%) scale(0);
        filter: drop-shadow(0 8px 12px rgba(40,70,30,.35)); opacity: 0; transition: .5s cubic-bezier(.3,1.6,.5,1);
      }
      .logo.intro { transform: translate(-50%, -50%) scale(1); opacity: 1; }

      .banner, .combo {
        position: absolute; left: 50%; top: 40%; white-space: nowrap; text-align: center;
        transform: translate(-50%, -50%) scale(0); opacity: 0;
      }
      .banner {
        top: 60%; font-size: min(7vw, 34px); padding: 10px 22px; border-radius: 30px;
        background: rgba(124,79,224,.92); box-shadow: 0 5px 0 #5a35a8; text-shadow: 0 2px 0 #4b2a8e;
        transition: .35s cubic-bezier(.3,1.6,.5,1);
      }
      .banner.on { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      .combo {
        font-size: min(13vw, 64px); color: #fff; -webkit-text-stroke: 3px var(--c, #ff7fb0);
        paint-order: stroke fill; text-shadow: 0 5px 0 var(--c, #ff7fb0), 0 10px 18px rgba(0,0,0,.25);
      }
      .combo.on { animation: combo 1.1s forwards; }
      @keyframes combo {
        0% { transform: translate(-50%, -50%) scale(.2) rotate(-8deg); opacity: 0; }
        18% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); opacity: 1; }
        30% { transform: translate(-50%, -50%) scale(1) rotate(0); }
        75% { transform: translate(-50%, -60%) scale(1); opacity: 1; }
        100% { transform: translate(-50%, -80%) scale(.9); opacity: 0; }
      }

      /* hint hand */
      .hand {
        position: absolute; left: 0; top: 0; width: 64px; height: 64px; opacity: 0; pointer-events: none;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); transform: translate(var(--x0), var(--y0));
      }
      .hand.on { animation: drag 1.5s ease-in-out infinite; }
      @keyframes drag {
        0% { transform: translate(calc(var(--x0) - 16px), calc(var(--y0) - 4px)) scale(1.1); opacity: 0; }
        15% { transform: translate(calc(var(--x0) - 16px), calc(var(--y0) - 4px)) scale(1); opacity: 1; }
        60% { transform: translate(calc(var(--x1) - 16px), calc(var(--y1) - 4px)) scale(1); opacity: 1; }
        85%, 100% { transform: translate(calc(var(--x1) - 16px), calc(var(--y1) - 4px)) scale(1); opacity: 0; }
      }

      .cta {
        position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
        transform: translate(-50%, 140%); padding: 14px 34px; border-radius: 34px; font-size: min(6vw, 26px); color: #fff;
        background: linear-gradient(#ffb347, #ff7a2f); box-shadow: 0 6px 0 #c9541a, 0 10px 18px rgba(120,50,10,.3);
        text-shadow: 0 2px 0 #c9541a; transition: transform .5s cubic-bezier(.3,1.5,.5,1);
      }
      .cta.show { transform: translate(-50%, 0); animation: pulse 1.6s 1s infinite; }
      @keyframes pulse { 0%, 100% { scale: 1; } 50% { scale: 1.06; } }

      /* end card */
      .end {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0;
        background: radial-gradient(circle at 50% 45%, rgba(255,255,240,.55), rgba(70,130,60,.75)); transition: opacity .5s;
      }
      .end.on { opacity: 1; pointer-events: auto; }
      .card { text-align: center; padding: 0 20px; animation: cardIn .7s cubic-bezier(.3,1.5,.5,1); }
      @keyframes cardIn { from { transform: scale(.4); opacity: 0; } }
      .elogo { width: min(78vw, 380px); filter: drop-shadow(0 10px 14px rgba(40,70,30,.4)); animation: float 3s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-8px) rotate(-1.5deg); } }
      .card h1 { font-size: min(10vw, 48px); margin-top: 6px; text-shadow: 0 4px 0 #5a35a8, 0 8px 14px rgba(0,0,0,.25); }
      .card p { font-size: min(4.6vw, 20px); margin: 8px auto 22px; max-width: 360px; text-shadow: 0 2px 0 rgba(60,40,100,.6); }
      .card .big {
        padding: 18px 48px; border-radius: 40px; font-size: min(7.5vw, 34px); color: #fff;
        background: linear-gradient(#ffb347, #ff7a2f); box-shadow: 0 7px 0 #c9541a, 0 12px 22px rgba(120,50,10,.35);
        text-shadow: 0 2px 0 #c9541a; animation: pulse 1.3s infinite;
      }

      @media (orientation: landscape) and (max-height: 520px) {
        .moves { width: 72px; height: 72px; }
        .moves b { font-size: 30px; }
        .goal { height: 44px; }
        .goal b { font-size: 26px; }
        .cta { padding: 10px 26px; font-size: 20px; bottom: 12px; }
        .elogo { width: min(40vw, 300px); }
      }
    </style>
    <script src="mraid.js"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <div id="boot"><i></i></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
