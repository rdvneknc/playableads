<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Ottoman Wars — Ad 1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1d140c;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #backdrop {
        position: fixed;
        inset: -60px;
        background: linear-gradient(#5d7aa8, #e9c58f 45%, #6d7a3a 46%, #3b4220);
        filter: blur(30px) saturate(1.1);
        z-index: 0;
      }

      #game-container {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
      }

      #game-container canvas {
        display: block;
        margin: 0 auto;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
