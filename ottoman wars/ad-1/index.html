<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Ottoman Wars — Ad 1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1d140c;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #backdrop {
        position: fixed;
        inset: -60px;
        background: linear-gradient(#5d7aa8, #e9c58f 45%, #6d7a3a 46%, #3b4220);
        filter: blur(30px) saturate(1.1);
        z-index: 0;
      }

      #game-container {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
      }

      #rotate-hint {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        display: none;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(20, 12, 4, 0.85);
        border: 2px solid #e0b64e;
        color: #fff3cf;
        font: 700 15px/1.2 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        white-space: nowrap;
        pointer-events: none;
      }
      #rotate-hint i {
        display: inline-block;
        width: 14px;
        height: 22px;
        border: 2px solid #e0b64e;
        border-radius: 3px;
        animation: rot 1.6s ease-in-out infinite;
      }
      @keyframes rot {
        0%, 30% { transform: rotate(0); }
        60%, 100% { transform: rotate(-90deg); }
      }

      #game-container canvas {
        display: block;
        margin: 0 auto;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="game-container"></div>
    <div id="rotate-hint"><i></i>Daha iyi deneyim için telefonu yan çevir</div>
    <!-- Ad SDKs inject the real MRAID bridge here; in a plain browser this simply 404s -->
    <script src="mraid.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
