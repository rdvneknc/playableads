<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Ottoman Wars — Ad 3</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #1d140c;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; inset: 0; pointer-events: none; overflow: hidden; color: #fff;
        font-family: OWUi, 'Arial Black', Arial, sans-serif; z-index: 2;
      }
      #hud button { font-family: inherit; border: 0; cursor: pointer; pointer-events: auto; }

      /* loading */
      #boot {
        position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 40%, #4a2a14, #140b05 70%); color: #f6d27a;
        font: 900 26px/1 Georgia, serif; letter-spacing: 2px;
      }
      #boot i { width: 42px; height: 42px; border-radius: 50%; border: 5px solid rgba(246,210,122,.25); border-top-color: #f6d27a; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* top progress */
      .top {
        position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translate(-50%, -30px);
        opacity: 0; transition: .4s; width: min(62vw, 420px);
      }
      .top.show { opacity: 1; transform: translate(-50%, 0); }
      .prog { display: flex; align-items: center; gap: 8px; }
      .track {
        position: relative; flex: 1; height: 14px; border-radius: 10px; background: rgba(30,16,6,.72);
        border: 2px solid #e8b33a; box-shadow: 0 3px 10px rgba(0,0,0,.35), inset 0 2px 4px rgba(0,0,0,.4);
      }
      .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 8px; background: linear-gradient(#ff6a5a, #c8202a 60%, #8d1018); }
      .knob {
        position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff6c8, #e8b33a 55%, #9a6a10); border: 2px solid #5a3008; box-shadow: 0 2px 6px rgba(0,0,0,.5);
      }
      .ic-army, .ic-castle { width: 26px; height: 26px; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
      .ic-army { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a7a, #c8202a 60%, #6d0c12); border: 2px solid #e8b33a; }
      .ic-castle {
        background: linear-gradient(#2c5fb8, #1c3f86);
        clip-path: polygon(0 100%, 0 20%, 18% 20%, 18% 38%, 36% 38%, 36% 0, 64% 0, 64% 38%, 82% 38%, 82% 20%, 100% 20%, 100% 100%);
      }
      .cta-mini {
        position: absolute; right: calc(env(safe-area-inset-right, 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 12px);
        padding: 8px 14px; border-radius: 999px; font-size: 13px; color: #fff; letter-spacing: .5px;
        background: linear-gradient(#56e07a, #179a43); border: 2px solid #fff; box-shadow: 0 4px 0 #0c5a26, 0 6px 12px rgba(0,0,0,.35);
        text-shadow: 0 2px 0 #0c5a26; opacity: 0; transform: scale(.6); transition: .4s;
      }
      .cta-mini.show { opacity: 1; transform: scale(1); animation: pulse 1.6s ease-in-out infinite 1s; }

      /* title */
      .title {
        position: absolute; left: 0; right: 0; top: 16%; text-align: center; opacity: 0; transform: scale(.7); transition: .6s cubic-bezier(.2,1.6,.4,1);
      }
      .title.show { opacity: 1; transform: scale(1); }
      .t1 {
        font: 400 clamp(40px, 11vw, 84px)/1 OWTitle, Georgia, serif; letter-spacing: 2px;
        background: linear-gradient(#fff7d0 10%, #f6d27a 45%, #c8891c 75%, #fbe39a); -webkit-background-clip: text; background-clip: text; color: transparent;
        -webkit-text-stroke: 1.5px #5a2a06; filter: drop-shadow(0 4px 0 #3a1a04) drop-shadow(0 10px 16px rgba(0,0,0,.55));
      }
      .t2 { margin-top: 10px; font-size: clamp(15px, 4vw, 22px); letter-spacing: 3px; text-shadow: 0 2px 0 #3a1a04, 0 0 12px rgba(0,0,0,.6); }

      /* drag tutorial: a finger circling inside a joystick ring */
      .hand .ring { position: relative; width: 120px; height: 120px; margin: 0 auto 10px; border-radius: 50%; background: rgba(0,0,0,.22); border: 3px solid rgba(255,255,255,.7); }
      .hand .ring .finger { animation: circle 1.8s linear infinite; }
      @keyframes circle { 0% { transform: rotate(0) translateX(34px) rotate(0); } 100% { transform: rotate(360deg) translateX(34px) rotate(-360deg); } }

      /* joystick */
      .joy { position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%; background: rgba(0,0,0,.18); border: 3px solid rgba(255,255,255,.55); opacity: 0; transition: opacity .15s; }
      .joy.show { opacity: 1; }
      .joy .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #f0dcb0); box-shadow: 0 4px 10px rgba(0,0,0,.35); }

      /* sage tip */
      .tip {
        position: absolute; left: 0; top: 0; max-width: min(64vw, 280px); padding: 10px 14px; border-radius: 16px; background: #fffaf0; color: #3a1d08;
        font: 700 15px/1.25 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; box-shadow: 0 6px 16px rgba(0,0,0,.3); border: 3px solid #e8b33a;
        opacity: 0; transition: opacity .25s; text-align: center; will-change: transform;
      }
      .tip::after { content: ''; position: absolute; left: 50%; bottom: -12px; margin-left: -10px; border: 10px solid transparent; border-bottom: 0; border-top-color: #e8b33a; }
      .tip.show { opacity: 1; }
      .tip.pop span { display: inline-block; animation: bump .35s ease-out; }
      .stackcount {
        position: absolute; left: 0; top: 0; padding: 2px 10px 3px; border-radius: 10px; font-size: 18px; background: rgba(30,16,6,.75); border: 2px solid #fff; display: none; will-change: transform;
      }
      .stackcount.max { background: linear-gradient(#ff6a5a, #c8202a); }

      /* purse (akçe counter) */
      .purse {
        position: absolute; left: calc(env(safe-area-inset-left, 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; align-items: center; gap: 8px;
        padding: 5px 14px 5px 6px; border-radius: 999px; background: rgba(30,16,6,.72); border: 2px solid #e8b33a; font-size: 20px; opacity: 0; transition: .4s;
      }
      .purse.show { opacity: 1; }
      .purse i { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8, #ffcf3a 50%, #b07a10); border: 2px solid #7a4a06; }
      .purse b { font-weight: 400; min-width: 22px; }
      .purse.bump i { animation: bump .25s ease-out; }

      /* enemy countdown */
      .clock {
        position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 58px); transform: translate(-50%, -20px); opacity: 0; transition: .35s;
        display: grid; grid-template-columns: auto auto; gap: 4px 10px; align-items: center; padding: 6px 12px; border-radius: 14px; background: rgba(30,16,6,.72); border: 2px solid #e8b33a;
      }
      .clock.show { opacity: 1; transform: translate(-50%, 0); }
      .clock .lbl { font-size: 13px; color: #ffd9a0; letter-spacing: 1px; }
      .clock b { font-weight: 400; font-size: 18px; text-align: right; }
      .clock .cbar { grid-column: 1 / 3; width: min(50vw, 220px); height: 8px; border-radius: 6px; background: rgba(0,0,0,.4); overflow: hidden; }
      .clock .cfill { height: 100%; background: linear-gradient(90deg, #ff6a5a, #e8b33a); }
      .clock.urgent { border-color: #ff5a4a; animation: pulse .8s ease-in-out infinite; }
      .callout.small { font-size: clamp(30px, 9vw, 56px); }

      /* raid bar */
      .raid { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 58px); transform: translate(-50%, -20px); opacity: 0; transition: .35s; }
      .raid.show { opacity: 1; transform: translate(-50%, 0); }
      .raid .row { display: flex; align-items: center; gap: 10px; }
      .raid .foes { min-width: 46px; padding: 3px 10px; border-radius: 12px; text-align: center; font-weight: 400; font-size: 20px; background: linear-gradient(#6fb1ff, #2f6fd6); border: 2px solid #fff; }
      .raid .bar { width: min(52vw, 260px); height: 18px; border-radius: 10px; background: rgba(20,10,4,.8); border: 2px solid #fff; overflow: hidden; }
      .raid .hp { height: 100%; width: 100%; background: linear-gradient(#ffe08a, #e8b33a); transition: width .15s; }
      .raid .hp.low { background: linear-gradient(#ff8a7a, #c8202a); }

      /* swipe tutorial */
      .hand { position: absolute; left: 50%; bottom: 17%; transform: translateX(-50%); text-align: center; opacity: 0; transition: .4s; }
      .hand.show { opacity: 1; }
      .swipe { position: relative; width: 220px; height: 56px; margin: 0 auto 10px; border-radius: 30px; background: rgba(0,0,0,.28); border: 2px dashed rgba(255,255,255,.55); }
      .finger {
        position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #fff, #f3e6d0); box-shadow: 0 0 0 6px rgba(255,255,255,.3), 0 6px 14px rgba(0,0,0,.4);
        animation: swipe 1.6s ease-in-out infinite;
      }
      @keyframes swipe { 0%, 100% { transform: translateX(-80px); } 50% { transform: translateX(80px); } }
      .lbl { font-size: clamp(17px, 4.6vw, 24px); letter-spacing: 1px; text-shadow: 0 3px 0 #5a1a08, 0 0 14px rgba(0,0,0,.7); }

      /* count badges */
      .layer { position: absolute; inset: 0; }
      .bubble {
        position: absolute; left: 0; top: 0; padding: 4px 13px 5px; min-width: 44px; text-align: center; border-radius: 14px;
        font-size: 22px; line-height: 1.1; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.35); will-change: transform;
      }
      .bubble::after { content: ''; position: absolute; left: 50%; bottom: -10px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #fff; }
      .bubble.red { background: linear-gradient(#ff6a5a, #c8202a); text-shadow: 0 2px 0 #6d0c12; }
      .bubble.blue { background: linear-gradient(#6fb1ff, #2f6fd6); text-shadow: 0 2px 0 #12306a; }
      .bubble.bump span { display: inline-block; animation: bump .28s ease-out; }
      @keyframes bump { 40% { transform: scale(1.45); } }

      .float {
        position: absolute; transform: translate(-50%, -50%); font-size: clamp(34px, 9vw, 58px); animation: rise 1.1s ease-out forwards; white-space: nowrap;
      }
      .float.good { color: #fff; text-shadow: 0 4px 0 #0b3a8a, 0 0 18px rgba(47,168,255,.9); }
      .float.bad { color: #fff; text-shadow: 0 4px 0 #7a0812, 0 0 18px rgba(255,58,74,.9); }
      @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }

      .callout {
        position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); font: 400 clamp(46px, 13vw, 96px)/1 OWTitle, Georgia, serif;
        letter-spacing: 3px; white-space: nowrap; animation: callout 1.5s ease-out forwards;
        color: #fff; -webkit-text-stroke: 2px #3a1a04; text-shadow: 0 6px 0 #3a1a04, 0 0 30px rgba(0,0,0,.5);
      }
      .callout.red { color: #ffdcd6; text-shadow: 0 6px 0 #7a0812, 0 0 34px rgba(255,60,60,.8); }
      .callout.gold { color: #ffe59a; text-shadow: 0 6px 0 #6a3a06, 0 0 34px rgba(255,200,80,.8); }
      @keyframes callout { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }

      .siege { position: absolute; left: 0; top: 0; text-align: center; opacity: 0; transition: opacity .3s; }
      .siege.show { opacity: 1; }
      .siege .lbl { font-size: 20px; margin-bottom: 6px; }
      .siege .bar { width: 190px; height: 18px; border-radius: 10px; background: rgba(20,10,4,.8); border: 2px solid #fff; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
      .siege .hp { height: 100%; width: 100%; background: linear-gradient(#7ab8ff, #2f6fd6); transition: width .12s; }

      .flash { position: absolute; inset: 0; opacity: 0; }
      .flash.go { animation: flash .5s ease-out; }
      @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

      /* end card */
      .end {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto;
        background: radial-gradient(circle at 50% 45%, rgba(40,20,6,.35), rgba(8,4,2,.82) 75%); opacity: 0; transition: opacity .45s;
      }
      .end.show { opacity: 1; }
      .rays {
        position: absolute; left: 50%; top: 42%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax; opacity: .35;
        background: repeating-conic-gradient(from 0deg, rgba(255,214,120,.55) 0 9deg, transparent 9deg 22deg);
        -webkit-mask: radial-gradient(circle, #000 10%, transparent 55%); mask: radial-gradient(circle, #000 10%, transparent 55%);
        animation: spin 22s linear infinite;
      }
      .end.lose .rays { opacity: .12; }
      .panel {
        position: relative; width: min(86vw, 420px); padding: 26px 22px 22px; text-align: center; border-radius: 26px;
        background: linear-gradient(#5a1a12, #2a0c08); border: 4px solid #e8b33a;
        box-shadow: 0 0 0 4px #5a2a06, 0 22px 50px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.2);
        transform: scale(.6) translateY(40px); transition: transform .55s cubic-bezier(.2,1.5,.4,1) .1s;
      }
      .end.show .panel { transform: none; }
      .logo { font: 400 22px/1 OWTitle, Georgia, serif; color: #f6d27a; letter-spacing: 3px; opacity: .9; }
      .res {
        margin: 10px 0 6px; font: 400 clamp(40px, 12.5vw, 76px)/1.1 OWTitle, Georgia, serif; letter-spacing: 1px; white-space: nowrap;
        background: linear-gradient(#fffbe0 10%, #ffd86a 50%, #e08a12); -webkit-background-clip: text; background-clip: text; color: transparent;
        -webkit-text-stroke: 1.5px #4a1a02; filter: drop-shadow(0 5px 0 #2a0c02);
      }
      .end.lose .res { background: linear-gradient(#fff, #ffb3a8 50%, #e0453a); -webkit-background-clip: text; background-clip: text; }
      .stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
      .stars i {
        width: 44px; height: 44px; background: linear-gradient(#fff6c8, #f6c13a 55%, #c8891c);
        clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        animation: star .5s cubic-bezier(.2,1.8,.4,1) both;
      }
      .stars i:nth-child(2) { width: 56px; height: 56px; margin-top: -8px; animation-delay: .15s; }
      .stars i:nth-child(1) { animation-delay: .3s; }
      .stars i:nth-child(3) { animation-delay: .45s; }
      @keyframes star { from { transform: scale(0) rotate(-60deg); } to { transform: none; } }
      .line { font-size: 16px; color: #ffe8c0; margin: 6px 0 10px; line-height: 1.3; }
      .stat { display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px; border-radius: 12px; background: rgba(0,0,0,.3); margin-bottom: 14px; }
      .stat span { font-size: 14px; color: #f6d27a; letter-spacing: 2px; }
      .stat b { font-size: 26px; font-weight: 400; }
      .cta {
        display: block; position: relative; overflow: hidden; width: 100%; padding: 16px 0 18px; border-radius: 18px; font-size: clamp(24px, 7vw, 32px); color: #fff; letter-spacing: 1px;
        background: linear-gradient(#6af08c, #1fb54f 55%, #138a3a); border: 3px solid #fff; box-shadow: 0 6px 0 #0b5a24, 0 12px 22px rgba(0,0,0,.45);
        text-shadow: 0 3px 0 #0b5a24; animation: pulse 1.2s ease-in-out infinite .8s;
      }
      .cta::after {
        content: ''; position: absolute; top: -20%; bottom: -20%; width: 30%; left: -40%; transform: skewX(-20deg);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); animation: shine 2.2s ease-in-out infinite 1s;
      }
      @keyframes shine { 0% { left: -40%; } 45%, 100% { left: 120%; } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      .retry { margin-top: 14px; background: none; color: #f6d27a; font-size: 16px; padding: 6px 12px; }
      /* short landscape screens: compact end card */
      @media (max-height: 520px) {
        .panel { padding: 12px 18px 10px; width: min(70vw, 400px); }
        .logo { font-size: 15px; }
        .res { margin: 4px 0 2px; font-size: clamp(40px, 12vh, 60px); }
        .stars i { width: 30px; height: 30px; }
        .stars i:nth-child(2) { width: 38px; height: 38px; margin-top: -4px; }
        .stars { margin: 0 0 2px; }
        .line { font-size: 14px; margin: 2px 0 6px; }
        .stat { margin-bottom: 8px; padding: 3px 12px; }
        .stat b { font-size: 20px; }
        .cta { padding: 10px 0 12px; font-size: 24px; }
        .retry { margin-top: 6px; font-size: 14px; }
        .title { top: 8%; }
        .hand { bottom: 8%; }
        .callout { top: 26%; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <div id="boot"><i></i>OTTOMAN WARS</div>
    <!-- Ad SDKs inject the real MRAID bridge here; in a plain browser this simply 404s -->
    <script src="mraid.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
