<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Ottoman Wars — Ad 7</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #d8c9a4;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 60%, rgba(40,22,6,.35) 100%); }
      #hud {
        position: fixed; inset: 0; pointer-events: none; overflow: hidden; color: #fff; z-index: 2;
        font-family: OWUi, 'Arial Black', Arial, sans-serif;
      }
      #hud button { font-family: inherit; border: 0; cursor: pointer; pointer-events: auto; }
      #hud:not(.on) .money, #hud:not(.on) .goal { opacity: 0; }
      #hud.over .money, #hud.over .goal, #hud.over .cta-mini, #hud.over .next, #hud.reveal .goal, #hud.reveal .money { opacity: 0; pointer-events: none; transition: opacity .4s; }

      #boot { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #4a2a14, #140b05 70%); }
      #boot i { width: 42px; height: 42px; border-radius: 50%; border: 5px solid rgba(246,210,122,.25); border-top-color: #f6d27a; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .coin { display: inline-block; width: 1.05em; height: 1.05em; border-radius: 50%; vertical-align: -0.15em;
        background: radial-gradient(circle at 35% 30%, #fff6c0 0 12%, #f6c445 30%, #b77a12 95%); box-shadow: 0 1px 0 #6a4206, inset 0 0 0 2px rgba(120,70,0,.35); }
      .money {
        position: absolute; left: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; align-items: center; gap: 8px;
        padding: 5px 16px 5px 8px; border-radius: 16px; background: rgba(28,16,6,.62); font-size: clamp(18px, 5vw, 24px);
        text-shadow: 0 2px 0 rgba(0,0,0,.6); transition: opacity .4s;
      }
      .money.bump { animation: bump .25s; }
      @keyframes bump { 50% { transform: scale(1.12); } }

      .goal {
        position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + clamp(58px, 15vw, 68px)); transform: translateX(-50%); opacity: 0;
        padding: 8px 18px; border-radius: 12px; white-space: nowrap; font-size: clamp(15px, 4.4vw, 20px); color: #fbe7b4;
        background: linear-gradient(rgba(60,30,8,.9), rgba(30,14,4,.9)); border: 2px solid #d9a63a; transition: opacity .3s;
      }
      .goal.on { opacity: 1; }
      .goal.pop { animation: gpop .45s cubic-bezier(.3,1.6,.5,1); }
      @keyframes gpop { from { transform: translateX(-50%) scale(.6); } }

      .cta-mini {
        position: absolute; right: 10px; top: calc(env(safe-area-inset-top, 0px) + 12px); padding: 7px 12px; border-radius: 10px; font-size: clamp(11px, 3vw, 14px); color: #2a1a04;
        background: linear-gradient(#e6f56a, #a8c822); box-shadow: 0 3px 0 #5a7010; border: 2px solid #f6ffc0 !important;
      }

      .banner {
        position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.6); opacity: 0; white-space: nowrap;
        font-size: clamp(15px, 4.4vw, 22px); padding: 8px 18px; border-radius: 10px; color: #fff;
        background: rgba(40,110,30,.88); border: 2px solid #b8f080; transition: .3s cubic-bezier(.3,1.6,.5,1);
      }
      .banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      .bigtxt {
        position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); white-space: nowrap; opacity: 0; text-align: center;
        font: 400 clamp(26px, 8.2vw, 70px)/1 OWTitle, Georgia, serif; letter-spacing: 2px; color: #fff;
        -webkit-text-stroke: 2px #3a1c06; paint-order: stroke fill; text-shadow: 0 5px 0 #3a1c06, 0 10px 24px rgba(0,0,0,.5);
      }
      .bigtxt.gold { color: #ffd25a; }
      .bigtxt.red { color: #ff6a4a; }
      .bigtxt.on { animation: big 2s forwards; }
      @keyframes big {
        0% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
        14% { transform: translate(-50%, -50%) scale(.95); opacity: 1; }
        22% { transform: translate(-50%, -50%) scale(1); }
        80% { opacity: 1; }
        100% { transform: translate(-50%, -60%) scale(1); opacity: 0; }
      }
      .next { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; white-space: nowrap; animation: nextIn .8s cubic-bezier(.3,1.5,.5,1) both; transition: opacity .4s; }
      .next small { display: block; font-size: clamp(16px, 4.6vw, 22px); color: #fbe7b4; text-shadow: 0 2px 0 #3a1c06; letter-spacing: 2px; }
      .next b { display: block; font: 400 clamp(30px, 9vw, 76px)/1.05 OWTitle, Georgia, serif; color: #ff6a4a; -webkit-text-stroke: 2px #3a1c06; paint-order: stroke fill; text-shadow: 0 5px 0 #3a1c06, 0 10px 24px rgba(0,0,0,.5); }
      @keyframes nextIn { from { transform: translateX(-50%) scale(.3); opacity: 0; } }

      .layer { position: absolute; inset: 0; }
      .pop { position: absolute; transform: translate(-50%, -50%); font-size: clamp(16px, 4.6vw, 22px); white-space: nowrap; text-shadow: 0 2px 0 #3a1c06, 0 0 6px #000; animation: popUp 1.1s forwards; }
      .pop.full { color: #ff8a5a; }
      @keyframes popUp { 0% { transform: translate(-50%, -20%) scale(.5); opacity: 0; } 20% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -160%); opacity: 0; } }

      /* joystick */
      .joy { position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%; background: rgba(0,0,0,.18); border: 3px solid rgba(255,255,255,.55); opacity: 0; transition: opacity .15s; }
      .joy.show { opacity: 1; }
      .joy .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #f0dcb0); box-shadow: 0 4px 10px rgba(0,0,0,.35); }
      /* drag tutorial */
      .tut { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity .3s; }
      .tut.show { opacity: 1; }
      .tut .hand { position: absolute; left: -26px; top: -6px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); animation: swipe 1.6s ease-in-out infinite; }
      @keyframes swipe { 0%, 100% { transform: translate(-50px, 0); } 50% { transform: translate(50px, 0); } }
      .tut .lbl { position: absolute; left: 0; top: 66px; transform: translateX(-50%); white-space: nowrap; font-size: clamp(18px, 5vw, 24px); text-shadow: 0 2px 0 #000, 0 0 8px #000; letter-spacing: 2px; }
      .flash { position: absolute; inset: 0; background: #fff6dc; opacity: 0; }
      .flash.on { animation: flash .5s; }
      @keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }

      /* end card */
      .end { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; background: radial-gradient(circle at 50% 40%, rgba(60,30,8,.55), rgba(12,6,2,.92)); transition: opacity .6s; }
      .end.on { opacity: 1; pointer-events: auto; }
      .card-end { text-align: center; padding: 0 18px; animation: cardIn .7s cubic-bezier(.3,1.5,.5,1); }
      @keyframes cardIn { from { transform: scale(.5); opacity: 0; } }
      .elogo { width: min(70vw, 340px); filter: drop-shadow(0 10px 18px rgba(0,0,0,.6)); }
      .card-end h1 { font: 400 clamp(26px, 7.6vw, 46px)/1.15 OWTitle, Georgia, serif; color: #ffd25a; margin: 8px 0; text-shadow: 0 4px 0 #3a1c06; }
      .card-end p { font-size: clamp(13px, 3.8vw, 17px); margin: 6px auto 20px; max-width: 360px; color: #fbe7b4; }
      .card-end .big {
        padding: 16px 44px; border-radius: 14px; font-size: clamp(20px, 6.4vw, 30px); color: #2a1a04;
        background: linear-gradient(#e6f56a, #a8c822); box-shadow: 0 6px 0 #5a7010, 0 12px 22px rgba(0,0,0,.4); border: 3px solid #f6ffc0 !important;
        animation: pulse2 1.2s infinite;
      }
      @keyframes pulse2 { 50% { transform: scale(1.06); } }

      @media (orientation: landscape) and (max-height: 520px) {
        .elogo { width: min(32vw, 230px); }
        .card-end p { margin: 4px auto 10px; }
        .card-end .big { padding: 10px 34px; }
        .next { top: 12%; }
      }
    </style>
    <script src="mraid.js"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="vignette"></div>
    <div id="hud"></div>
    <div id="boot"><i></i></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
