<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Ottoman Wars — Ad 6</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #d8c9a4;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(40,22,6,.42) 100%); }
      #hud {
        position: fixed; inset: 0; pointer-events: none; overflow: hidden; color: #fff; z-index: 2;
        font-family: OWUi, 'Arial Black', Arial, sans-serif;
      }
      #hud button { font-family: inherit; border: 0; cursor: pointer; pointer-events: auto; }
      #hud > :not(.end):not(.layer):not(.flash) { transition: opacity .4s, transform .4s; }
      #hud:not(.on) .side, #hud:not(.on) .topc, #hud:not(.on) .cards { opacity: 0; }
      #hud.over .side, #hud.over .topc, #hud.over .cards, #hud.over .cta-mini, #hud.over .ability { opacity: 0; pointer-events: none; }

      #boot {
        position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 40%, #4a2a14, #140b05 70%);
      }
      #boot i { width: 42px; height: 42px; border-radius: 50%; border: 5px solid rgba(246,210,122,.25); border-top-color: #f6d27a; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .coin { display: inline-block; width: 1.05em; height: 1.05em; border-radius: 50%; vertical-align: -0.15em;
        background: radial-gradient(circle at 35% 30%, #fff6c0 0 12%, #f6c445 30%, #b77a12 95%); box-shadow: 0 1px 0 #6a4206, inset 0 0 0 2px rgba(120,70,0,.35); }

      /* resources */
      .side { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); font-size: clamp(13px, 3.6vw, 17px); text-shadow: 0 2px 0 rgba(0,0,0,.7), 0 0 6px rgba(0,0,0,.5); }
      .side .nm { font-size: .9em; opacity: .95; margin-bottom: 4px; color: #fbe7b4; }
      .side .res { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 14px; background: rgba(28,16,6,.55); }
      .me { left: 10px; }
      .foe { right: 10px; text-align: right; }
      .foe .res { justify-content: flex-end; }
      .me.bump .res { animation: bump .4s; }
      @keyframes bump { 40% { transform: scale(1.15); } }

      .topc { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 6px); transform: translateX(-50%); text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.7); }
      .topc .time { font-size: clamp(13px, 3.4vw, 16px); color: #fff; }
      .moons { display: flex; gap: 2px; justify-content: center; margin: 2px 0; }
      .moons svg { width: clamp(28px, 8vw, 40px); height: clamp(28px, 8vw, 40px); fill: #2a2418; stroke: #f0e2c0; stroke-width: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); transition: .3s; }
      .moons svg:nth-child(2) { transform: translateY(-4px) scale(1.15); }
      .moons svg.on { fill: #fff6dc; stroke: #ffd25a; animation: moon .7s; filter: drop-shadow(0 0 8px #ffd25a); }
      @keyframes moon { 0% { transform: scale(2.6) rotate(-30deg); opacity: 0; } 60% { transform: scale(.85); opacity: 1; } }
      .topc .pct { font-size: clamp(16px, 4.6vw, 22px); }

      .banner {
        position: absolute; left: 50%; top: 31%; transform: translate(-50%, -50%) scale(.6); opacity: 0; white-space: nowrap;
        font-size: clamp(15px, 4.4vw, 22px); padding: 8px 18px; border-radius: 10px; color: #fbe7b4;
        background: linear-gradient(rgba(60,30,8,.92), rgba(30,14,4,.92)); border: 2px solid #d9a63a; transition: .3s cubic-bezier(.3,1.6,.5,1);
      }
      .banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      .bigtxt {
        position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); white-space: nowrap; opacity: 0;
        font: 400 clamp(40px, 12vw, 88px)/1 OWTitle, Georgia, serif; letter-spacing: 2px; color: #fff;
        -webkit-text-stroke: 2px #3a1c06; paint-order: stroke fill; text-shadow: 0 5px 0 #3a1c06, 0 10px 24px rgba(0,0,0,.5);
      }
      .bigtxt.green { color: #9cf07a; }
      .bigtxt.gold { color: #ffd25a; }
      .bigtxt.red { color: #ff6a4a; }
      .bigtxt.on { animation: big 1.8s forwards; }
      @keyframes big {
        0% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
        14% { transform: translate(-50%, -50%) scale(.95); opacity: 1; }
        22% { transform: translate(-50%, -50%) scale(1); }
        80% { opacity: 1; }
        100% { transform: translate(-50%, -60%) scale(1); opacity: 0; }
      }

      /* unit cards */
      .cards { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); transform: translateX(-50%); display: flex; gap: 6px; padding: 5px; border-radius: 12px; background: rgba(20,12,4,.55); }
      .card {
        position: relative; width: clamp(62px, 18vw, 86px); height: clamp(70px, 20vw, 96px); border-radius: 8px; overflow: hidden;
        background: linear-gradient(#e8d6a8, #b08848); border: 3px solid #5a3a18; box-shadow: 0 3px 0 rgba(0,0,0,.4); transition: transform .15s, filter .2s;
      }
      .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .card b { position: absolute; right: 4px; top: 2px; font-size: clamp(13px, 3.6vw, 17px); text-shadow: 0 1px 0 #000, 0 0 4px #000; }
      .card span { position: absolute; left: 0; right: 0; bottom: 0; font-size: clamp(9px, 2.6vw, 12px); padding: 2px 0; background: rgba(20,10,2,.7); text-align: center; color: #fbe7b4; }
      .card.k-pasha { background: linear-gradient(#ffe38a, #c07a14); }
      .card.sel { border-color: #7dff4a; transform: translateY(-6px); box-shadow: 0 0 0 2px rgba(125,255,74,.4), 0 6px 0 rgba(0,0,0,.35); }
      .card.empty { filter: grayscale(1) brightness(.7); }
      .card.glow { animation: glow 0.9s infinite; }
      @keyframes glow { 50% { box-shadow: 0 0 18px 6px #ffd25a; transform: translateY(-6px) scale(1.06); } }

      .ability {
        position: absolute; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(100px, 26vw, 130px)); width: clamp(86px, 24vw, 112px); height: clamp(86px, 24vw, 112px);
        border-radius: 50%; color: #fff; font-size: clamp(12px, 3.4vw, 16px); line-height: 1.05; padding: 8px;
        background: radial-gradient(circle at 35% 30%, #ffb070, #d8301e 60%, #7a1006); border: 4px solid #ffd25a; box-shadow: 0 5px 0 #5a0a04, 0 8px 18px rgba(0,0,0,.4);
        text-shadow: 0 2px 0 #5a0a04; transform: scale(0); opacity: 0; pointer-events: none !important;
      }
      .ability.on { transform: scale(1); opacity: 1; pointer-events: auto !important; }
      .ability.glow { animation: pulse 0.8s infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(255,210,90,.35), 0 5px 0 #5a0a04; transform: scale(1.07); } }

      .cta-mini {
        position: absolute; right: 10px; top: calc(env(safe-area-inset-top, 0px) + clamp(66px, 17vw, 78px)); padding: 7px 12px; border-radius: 10px; font-size: clamp(11px, 3vw, 14px); color: #2a1a04;
        background: linear-gradient(#e6f56a, #a8c822); box-shadow: 0 3px 0 #5a7010; border: 2px solid #f6ffc0 !important;
      }

      /* hint hand */
      .hand { position: absolute; width: 64px; height: 64px; margin: -6px 0 0 -26px; opacity: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
      .hand.on { opacity: 1; animation: tap 1.1s infinite; }
      @keyframes tap { 0%, 100% { transform: translate(14px, 14px); } 45% { transform: translate(0, 0) scale(.92); } }
      .tapring { position: absolute; width: 60px; height: 30px; margin: -15px 0 0 -30px; border-radius: 50%; border: 3px solid #fff; opacity: 0; }
      .tapring.on { animation: ring 1.1s infinite; }
      @keyframes ring { 0%, 40% { transform: scale(.3); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
      .tapmark { position: absolute; width: 46px; height: 22px; margin: -11px 0 0 -23px; border-radius: 50%; border: 3px solid #7dff4a; animation: mark .5s forwards; }
      .tapmark.bad { border-color: #ff4030; }
      @keyframes mark { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

      .layer { position: absolute; inset: 0; }
      .loot { position: absolute; transform: translate(-50%, -50%); font-size: clamp(16px, 4.6vw, 22px); color: #ffe27a; white-space: nowrap; text-shadow: 0 2px 0 #3a1c06, 0 0 6px #000; animation: lootUp 1.6s forwards; }
      @keyframes lootUp { 0% { transform: translate(-50%, -20%) scale(.5); opacity: 0; } 15% { transform: translate(-50%, -70%) scale(1.15); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -220%) scale(1); opacity: 0; } }
      .coin.fly { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; animation: fly .8s cubic-bezier(.5,-0.3,.7,1) both; }
      @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.7); opacity: .6; } }
      .flash { position: absolute; inset: 0; background: #fff6dc; opacity: 0; }
      .flash.on { animation: flash .5s; }
      @keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }

      /* end card */
      .end { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; background: radial-gradient(circle at 50% 40%, rgba(60,30,8,.55), rgba(12,6,2,.92)); transition: opacity .6s; }
      .end.on { opacity: 1; pointer-events: auto; }
      .card-end { text-align: center; padding: 0 18px; animation: cardIn .7s cubic-bezier(.3,1.5,.5,1); }
      @keyframes cardIn { from { transform: scale(.5); opacity: 0; } }
      .elogo { width: min(64vw, 320px); filter: drop-shadow(0 10px 18px rgba(0,0,0,.6)); }
      .end-moons svg { width: 52px; height: 52px; }
      .end-moons svg:nth-child(2) { transform: translateY(-8px) scale(1.2); }
      .card-end h1 { font: 400 clamp(28px, 8.4vw, 50px)/1.1 OWTitle, Georgia, serif; color: #ffd25a; margin: 6px 0; text-shadow: 0 4px 0 #3a1c06; }
      .eloot { font-size: clamp(20px, 6vw, 30px); color: #ffe27a; text-shadow: 0 2px 0 #3a1c06; }
      .eloot .coin { margin-right: 8px; }
      .card-end p { font-size: clamp(13px, 3.8vw, 17px); margin: 8px auto 18px; max-width: 360px; color: #fbe7b4; }
      .card-end .big {
        padding: 16px 44px; border-radius: 14px; font-size: clamp(20px, 6.4vw, 30px); color: #2a1a04;
        background: linear-gradient(#e6f56a, #a8c822); box-shadow: 0 6px 0 #5a7010, 0 12px 22px rgba(0,0,0,.4); border: 3px solid #f6ffc0 !important;
        animation: pulse2 1.2s infinite;
      }
      @keyframes pulse2 { 50% { transform: scale(1.06); } }

      @media (orientation: landscape) and (max-height: 520px) {
        .card { width: 64px; height: 72px; }
        .ability { width: 84px; height: 84px; bottom: 16px; right: 16px; }
        .elogo { width: min(30vw, 220px); }
        .end-moons svg { width: 38px; height: 38px; }
        .card-end p { margin: 4px auto 10px; }
        .card-end .big { padding: 10px 34px; }
      }
    </style>
    <script src="mraid.js"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="vignette"></div>
    <div id="hud"></div>
    <div id="boot"><i></i></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
